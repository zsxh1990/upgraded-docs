services:
  kb:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./wiki:/app/wiki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
