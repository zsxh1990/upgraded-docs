<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档上传 — 机器人知识库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f5f7; color: #172b4d; }
.header { background: #0747A6; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 24px; }
.header h1 { font-size: 20px; }
.header nav { display: flex; gap: 16px; }
.header nav a { color: #b3d4ff; text-decoration: none; font-size: 14px; }
.header nav a:hover { color: #fff; }
.container { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
.drop-zone {
  border: 2px dashed #dfe1e6; border-radius: 8px; padding: 48px 24px;
  text-align: center; background: #fff; cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.drop-zone:hover, .drop-zone.dragover { border-color: #0747A6; background: #f0f4ff; }
.drop-zone p { font-size: 15px; color: #5e6c84; margin-bottom: 8px; }
.drop-zone .hint { font-size: 13px; color: #97a0af; }
.file-list { margin-top: 16px; }
.file-item {
  display: flex; align-items: center; justify-content: space-between;
  background: #fff; padding: 12px 16px; border-radius: 6px; margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.file-name { font-size: 14px; font-weight: 500; }
.file-size { font-size: 13px; color: #5e6c84; }
.file-status { font-size: 13px; padding: 2px 8px; border-radius: 4px; }
.file-status.ok { background: #e3fcef; color: #006644; }
.file-status.err { background: #ffebe6; color: #bf2600; }
.file-status.uploading { background: #deebff; color: #0747A6; }
.upload-btn {
  margin-top: 16px; padding: 12px 32px; background: #0747A6; color: #fff;
  border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
}
.upload-btn:hover { background: #0052cc; }
.upload-btn:disabled { background: #a5adba; cursor: not-allowed; }
.result-box {
  margin-top: 20px; padding: 16px; border-radius: 6px; background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08); display: none;
}
.result-box h3 { font-size: 15px; margin-bottom: 8px; }
.result-box pre { font-size: 13px; white-space: pre-wrap; color: #172b4d; }
</style>
</head>
<body>
<div class="header">
  <h1>机器人知识库</h1>
  <nav>
    <a href="/">搜索</a>
    <a href="/conflicts.html">冲突管理</a>
    <a href="/graph.html">知识图谱</a>
    <a href="/upload.html">文档上传</a>
  </nav>
</div>

<div class="container">
  <h2 style="margin-bottom:16px;font-size:18px;">上传文档</h2>
  <div class="drop-zone" id="dropZone">
    <p>拖拽文件到此处，或点击选择文件</p>
    <p class="hint">支持 .md .txt .docx .xlsx .pptx</p>
    <input type="file" id="fileInput" multiple accept=".md,.txt,.docx,.xlsx,.pptx" style="display:none">
  </div>

  <div class="file-list" id="fileList"></div>
  <button class="upload-btn" id="uploadBtn" disabled onclick="uploadFiles()">上传并导入</button>

  <div class="result-box" id="resultBox">
    <h3>导入结果</h3>
    <pre id="resultText"></pre>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const uploadBtn = document.getElementById('uploadBtn');
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');

let selectedFiles = [];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => addFiles(fileInput.files));

function addFiles(files) {
  for (const f of files) {
    if (!selectedFiles.some(s => s.name === f.name)) {
      selectedFiles.push(f);
    }
  }
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = '';
  selectedFiles.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `
      <span class="file-name">${f.name}</span>
      <span class="file-size">${(f.size / 1024).toFixed(1)} KB</span>
      <span class="file-status" id="status-${i}">待上传</span>
    `;
    fileList.appendChild(div);
  });
  uploadBtn.disabled = selectedFiles.length === 0;
}

async function uploadFiles() {
  uploadBtn.disabled = true;
  let success = 0, failed = 0;

  for (let i = 0; i < selectedFiles.length; i++) {
    const f = selectedFiles[i];
    const statusEl = document.getElementById(`status-${i}`);
    statusEl.className = 'file-status uploading';
    statusEl.textContent = '上传中...';

    try {
      const form = new FormData();
      form.append('file', f);
      const resp = await fetch('/api/upload', { method: 'POST', body: form });
      const data = await resp.json();
      if (resp.ok) {
        statusEl.className = 'file-status ok';
        statusEl.textContent = '完成';
        success++;
      } else {
        statusEl.className = 'file-status err';
        statusEl.textContent = data.error || '失败';
        failed++;
      }
    } catch (e) {
      statusEl.className = 'file-status err';
      statusEl.textContent = '网络错误';
      failed++;
    }
  }

  resultBox.style.display = 'block';
  resultText.textContent = `上传完成: ${success} 成功, ${failed} 失败 (共 ${selectedFiles.length} 个文件)\n\n刷新页面搜索新文档。`;
}
</script>
</body>
</html>
