<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器人知识库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f5f7; color: #172b4d; }
.header { background: #0747A6; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 24px; }
.header h1 { font-size: 20px; }
.header nav { display: flex; gap: 16px; }
.header nav a { color: #b3d4ff; text-decoration: none; font-size: 14px; }
.header nav a:hover { color: #fff; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
.search-row { display: flex; gap: 8px; margin-bottom: 20px; }
.search-row input { flex:1; padding: 12px 16px; border: 2px solid #dfe1e6; border-radius: 6px; font-size: 16px; outline: none; }
.search-row input:focus { border-color: #0747A6; }
.search-row button { padding: 12px 28px; background: #0747A6; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
.search-row button:hover { background: #0052cc; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; }
.tab { padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; color: #42526e; background: #ebecf0; }
.tab.active { background: #fff; color: #0747A6; font-weight: 600; border-bottom: 2px solid #0747A6; }
.stats-bar { display: flex; gap: 24px; margin-bottom: 20px; padding: 12px 16px; background: #fff; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.stat-item { display: flex; gap: 8px; align-items: center; }
.stat-label { color: #5e6c84; font-size: 13px; }
.stat-value { font-weight: 600; font-size: 18px; color: #0747A6; }
.result-list { }
.result-item { background: #fff; border-radius: 6px; padding: 16px 20px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer; transition: box-shadow 0.15s; }
.result-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.result-title { font-size: 16px; font-weight: 600; color: #0747A6; margin-bottom: 6px; }
.result-snippet { font-size: 14px; color: #42526e; line-height: 1.5; }
.result-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #7a869a; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; background: #e3eefc; color: #0747A6; }
.empty { text-align: center; padding: 48px; color: #7a869a; }
.suggestions { position: absolute; background: #fff; border: 1px solid #dfe1e6; border-radius: 4px; max-height: 200px; overflow-y: auto; display: none; width: calc(100% - 110px); }
.suggestions div { padding: 8px 12px; cursor: pointer; font-size: 14px; }
.suggestions div:hover { background: #e3eefc; }
.search-wrap { position: relative; flex: 1; }
.hint-banner { font-size: 12px; padding: 6px 12px; border-radius: 4px; margin-bottom: 12px; display: none; }
.hint-banner.info { background: #e3eefc; color: #0747A6; }
.hint-banner.warn { background: #fff0e0; color: #d97008; }
mark.highlight { background: #ffeb3b; padding: 1px 3px; border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 机器人知识库</h1>
  <nav>
    <a href="/">搜索</a>
    <a href="/graph.html">知识图谱</a>
    <a href="/conflicts.html">冲突管理</a>
    <a href="/upload.html">上传</a>
  </nav>
</div>

<div class="container">

  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><span class="stat-label">文档</span><span class="stat-value" id="statDocs">-</span></div>
    <div class="stat-item"><span class="stat-label">冲突(待处理)</span><span class="stat-value" id="statConflicts">-</span></div>
    <div class="stat-item"><span class="stat-label">配置项</span><span class="stat-value" id="statConfigs">-</span></div>
  </div>

  <div id="searchModeHint" class="hint-banner"></div>

  <div class="search-row">
    <div class="search-wrap">
      <input id="searchInput" placeholder="搜索技术规范、参数配置…" oninput="onInput()" onkeydown="if(event.key==='Enter') search()">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <button onclick="search()">搜索</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('all',this)">全部</div>
    <div class="tab" id="tabCat"></div>
  </div>

  <div id="results" class="result-list">
    <div class="empty">输入关键词开始搜索</div>
  </div>
</div>

<script>
let currentCategory = "";

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    if (!r.ok) throw new Error('获取统计失败');
    const d = await r.json();
    document.getElementById('statDocs').textContent = d.documents;
    document.getElementById('statConflicts').textContent = d.conflicts.pending;
    document.getElementById('statConfigs').textContent = d.configs;
  } catch (e) {
    console.error('loadStats error:', e);
  }
}
loadStats();

async function loadSearchMode() {
  try {
    const r = await fetch('/api/search/mode');
    const d = await r.json();
    const hint = document.getElementById('searchModeHint');
    if (d.mode === 'bm25_only') {
      hint.textContent = '⚠️ 向量模型未加载，当前仅使用关键词搜索（BM25）';
      hint.className = 'hint-banner warn';
      hint.style.display = 'block';
    } else if (d.mode === 'no_index') {
      hint.textContent = 'ℹ️ 索引为空，导入文档后搜索功能将自动启用';
      hint.className = 'hint-banner info';
      hint.style.display = 'block';
    }
  } catch (e) { /* ignore */ }
}
loadSearchMode();

async function loadCategories() {
  try {
    const r = await fetch('/api/categories');
    if (!r.ok) throw new Error('获取分类失败');
    const cats = await r.json();
    const tab = document.getElementById('tabCat');
    if (cats.length > 0) {
      tab.textContent = cats[0].category + ' (' + cats[0].cnt + ')';
      tab.onclick = function() { switchTab(cats[0].category, this); };
      tab.classList.remove('tab');
      tab.className = 'tab';
      tab.style.display = '';
    } else {
      tab.style.display = 'none';
    }
  } catch (e) {
    console.error('loadCategories error:', e);
  }
}
loadCategories();

let suggestTimer;
function onInput() {
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(showSuggestions, 200);
}

async function showSuggestions() {
  const q = document.getElementById('searchInput').value.trim();
  const box = document.getElementById('suggestions');
  if (q.length < 2) { box.style.display = 'none'; return; }
  try {
    const r = await fetch('/api/search/suggest?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error('获取建议失败');
    const titles = await r.json();
    if (titles.length === 0) { box.style.display = 'none'; return; }
    box.innerHTML = titles.map(t => '<div onclick="selectSuggestion(\'' + t.replace(/'/g,"\\'") + '\')">' + t + '</div>').join('');
    box.style.display = 'block';
  } catch (e) {
    console.error('suggest error:', e);
    box.style.display = 'none';
  }
}

function selectSuggestion(t) {
  document.getElementById('searchInput').value = t;
  document.getElementById('suggestions').style.display = 'none';
  search();
}

function switchTab(cat, el) {
  document.querySelectorAll('.tab').forEach(t => t.className = 'tab');
  el.className = 'tab active';
  currentCategory = cat;
  search();
}

async function loadAllDocuments() {
  try {
    const r = await fetch('/api/documents');
    if (!r.ok) throw new Error('获取文档列表失败');
    const docs = await r.json();
    const el = document.getElementById('results');
    if (docs.length === 0) {
      el.innerHTML = '<div class="empty">暂无文档</div>';
      return;
    }
    el.innerHTML = docs.map(d =>
      '<div class="result-item" onclick="openDoc(\'' + d.id + '\')">' +
        '<div class="result-title">' + esc(d.title) + '</div>' +
        '<div class="result-meta">' +
          (d.category ? '<span class="badge">' + esc(d.category) + '</span>' : '') +
          (d.filename ? '<span>' + esc(d.filename) + '</span>' : '') +
          (d.created_at ? '<span>' + esc(d.created_at.slice(0,10)) + '</span>' : '') +
        '</div>' +
      '</div>'
    ).join('');
  } catch (e) {
    document.getElementById('results').innerHTML = '<div class="empty">加载失败，请刷新重试</div>';
    console.error('loadAllDocuments error:', e);
  }
}

async function search() {
  const q = document.getElementById('searchInput').value.trim();
  document.getElementById('suggestions').style.display = 'none';
  if (!q) {
    loadAllDocuments();
    return;
  }
  try {
    const url = '/api/search?q=' + encodeURIComponent(q) + '&top_k=20' + (currentCategory ? '&category=' + encodeURIComponent(currentCategory) : '');
    const r = await fetch(url);
    if (!r.ok) throw new Error('搜索请求失败');
    const data = await r.json();
    const el = document.getElementById('results');
    if (data.results.length === 0) {
      el.innerHTML = '<div class="empty">未找到相关内容，换个关键词试试</div>';
      return;
    }
    el.innerHTML = data.results.map(d =>
      '<div class="result-item" onclick="openDoc(\'' + d.id + '\')">' +
        '<div class="result-title">' + esc(d.title) + '</div>' +
        '<div class="result-snippet">' + highlightKeywords(esc(d.snippet), q) + '</div>' +
        '<div class="result-meta">' +
          (d.category ? '<span class="badge">' + esc(d.category) + '</span>' : '') +
          '<span>相关度: ' + (d.score > 0 ? d.score.toFixed(3) : '-') + '</span>' +
          (d.filename ? '<span>' + esc(d.filename) + '</span>' : '') +
        '</div>' +
      '</div>'
    ).join('');
  } catch (e) {
    document.getElementById('results').innerHTML = '<div class="empty">搜索失败，请检查网络连接后重试</div>';
    console.error('search error:', e);
  }
}

function highlightKeywords(text, query) {
  if (!text || !query) return text;
  const tokens = query.match(/[a-zA-Z0-9\-_./]+|[一-鿿]+/g);
  if (!tokens) return text;
  const seen = new Set();
  tokens.forEach(t => {
    const lower = t.toLowerCase();
    if (seen.has(lower)) return;
    seen.add(lower);
    const escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (/[一-鿿]/.test(t)) {
      [...t].forEach(ch => {
        const re = new RegExp('(' + ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        text = text.replace(re, '<mark class="highlight">$1</mark>');
      });
    } else {
      const re = new RegExp('(' + escaped + ')', 'gi');
      text = text.replace(re, '<mark class="highlight">$1</mark>');
    }
  });
  return text;
}

function openDoc(id) {
  window.location.href = '/document.html?id=' + id;
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 页面加载时显示所有文档
loadAllDocuments();
</script>
</body>
</html>
