<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档详情 - 机器人知识库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f4f5f7; color: #172b4d; }
.header { background: #0747A6; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 24px; }
.header h1 { font-size: 20px; cursor: pointer; }
.header nav { display: flex; gap: 16px; }
.header nav a { color: #b3d4ff; text-decoration: none; font-size: 14px; }
.header nav a:hover { color: #fff; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
.doc-card { background: #fff; border-radius: 6px; padding: 24px 32px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.doc-title { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
.doc-meta { display: flex; gap: 16px; margin-bottom: 20px; font-size: 13px; color: #7a869a; }
.doc-content { font-size: 15px; line-height: 1.8; color: #333; white-space: pre-wrap; }
.back { display: inline-block; margin-bottom: 16px; color: #0747A6; text-decoration: none; font-size: 14px; }
.back:hover { text-decoration: underline; }
.config-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
.config-table th { background: #f4f5f7; padding: 8px 12px; text-align: left; font-size: 13px; color: #5e6c84; }
.config-table td { padding: 8px 12px; border-top: 1px solid #dfe1e6; font-size: 14px; }
.section-title { font-size: 16px; font-weight: 600; margin: 24px 0 12px; color: #0747A6; }
</style>
</head>
<body>
<div class="header">
  <h1 onclick="location.href='/'">📚 机器人知识库</h1>
  <nav>
    <a href="/">搜索</a>
    <a href="/conflicts.html">冲突管理</a>
  </nav>
</div>
<div class="container">
  <a class="back" href="/">← 返回搜索</a>
  <div class="doc-card" id="docCard">
    <div class="doc-title" id="docTitle">加载中...</div>
    <div class="doc-meta">
      <span id="docCategory"></span>
      <span id="docFilename"></span>
      <span id="docDate"></span>
    </div>
    <div class="section-title">📄 文档内容</div>
    <div class="doc-content" id="docContent"></div>
    <div class="section-title">⚙️ 关联配置</div>
    <table class="config-table" id="configTable">
      <thead><tr><th>参数名</th><th>值</th></tr></thead>
      <tbody id="configBody"></tbody>
    </table>
  </div>
</div>

<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { document.getElementById('docTitle').textContent = '缺少文档 ID'; return; }

  const r = await fetch('/api/document/' + id);
  const doc = await r.json();
  if (doc.error) { document.getElementById('docTitle').textContent = '文档未找到'; return; }

  document.getElementById('docTitle').textContent = doc.title || '(无标题)';
  document.getElementById('docCategory').textContent = doc.category ? '分类: ' + doc.category : '';
  document.getElementById('docFilename').textContent = doc.filename || '';
  document.getElementById('docDate').textContent = doc.created_at ? '导入: ' + doc.created_at : '';
  document.getElementById('docContent').textContent = doc.content || '(无内容)';
  document.title = doc.title + ' - 机器人知识库';

  // 加载关联配置
  const cr = await fetch('/api/configs?doc_id=' + id);
  const configs = await cr.json();
  const tbody = document.getElementById('configBody');
  if (configs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#7a869a;padding:16px;">暂无关联参数</td></tr>';
  } else {
    tbody.innerHTML = configs.map(c => '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.value) + '</td></tr>').join('');
  }
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
load();
</script>
</body>
</html>
